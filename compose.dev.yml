# Разработка в контейнерах с горячей перезагрузкой:
#   docker compose -f compose.yml -f compose.dev.yml up
# Клиент: http://localhost:5173, API: http://localhost:3000, Postgres: localhost:5432
services:
  db:
    ports:
      - "5432:5432"

  api:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && npm run dev --workspace server"
    environment:
      DATABASE_URL: postgres://trainer:${POSTGRES_PASSWORD:-trainer}@db:5432/trainer
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-dev-token}
      LOG_PRETTY: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"

  web:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && npm rebuild esbuild && npx vite --host 0.0.0.0 --port 5173"
    environment:
      API_PROXY: http://api:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  node_modules:
